recent_progress_2026-05-04_F787_bit_overlap_diagnostic: |
  yale-codex added analyze_m2_combo_bit_overlap.py to compare combo records at
  the final-diff bit-position level.

  Compared F760/F763 HW82 records with F782/F783/F786 near misses by asking
  how much of the actual combo repair/addition set is covered by the union of
  standalone pair repair/addition sets.

  Key result:
    F760 best HW82: removed 52, added 49
    F763 best HW82: removed 54, added 54
    F782 best HW87: removed 62, added 67
    F783 best HW90: removed 54, added 62
    F786 best HW93: removed 52, added 63

  Standalone repair coverage does not separate successes:
    F763 covers 53/54 repaired bits
    F782 covers 62/62 repaired bits
    F786 covers 52/52 repaired bits

  Interpretation:
    The near misses know how to repair bits; they fail by adding too many new
    final-state bits. Next selector should estimate addition risk before full
    evaluation: reward repeated standalone-added bits and penalize broad
    added-bit union while keeping high repair union.

